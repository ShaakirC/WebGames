<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Night</title>
  <!-- Apply a saved light/dark choice before first paint (no flash). Logic lives in hub.js. -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('gamenight:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">

  <!-- Shared styles -->
  <link rel="stylesheet" href="css/base.css">
  <!-- Game styles: one file per game, scoped under .game--<id> -->
  <link rel="stylesheet" href="css/games/twenty-questions.css">
  <link rel="stylesheet" href="css/games/first-last.css">
  <link rel="stylesheet" href="css/games/chain-link.css">
  <link rel="stylesheet" href="css/games/mystery-number.css">
  <link rel="stylesheet" href="css/games/word-budget.css">
</head>
<body data-view="home">
  <header class="topbar">
    <a class="topbar__brand" href="#/">🎲 Game Night</a>
    <span class="topbar__title" id="topbar-title"></span>
    <a class="topbar__home btn btn--ghost btn--sm" href="#/">← All games</a>
    <button class="topbar__theme btn btn--sm" id="theme-toggle" type="button"></button>
  </header>

  <main id="app" class="app"></main>

  <!-- 1. Hub core + shared UI helpers (must load first) -->
  <script src="js/core/hub.js"></script>
  <script src="js/core/ui.js"></script>
  <!-- 2. Games: each file calls GameHub.register(). Order = order on the home screen. -->
  <script src="js/games/twenty-questions.js"></script>
  <script src="js/games/first-last.js"></script>
  <script src="js/games/chain-link-words.js"></script><!-- data, must load before chain-link.js -->
  <script src="js/games/chain-link.js"></script>
  <script src="js/games/mystery-number.js"></script>
  <script src="js/games/word-budget-words.js"></script><!-- data, must load before word-budget.js -->
  <script src="js/games/word-budget.js"></script>
  <!-- 3. Boot -->
  <script src="js/app.js"></script>
</body>
</html>
